<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><title>TARO 관리자</title><style>*{box-sizing:border-box}body{margin:0;background:#17111e;color:#f5e9de;font:16px/1.6 system-ui;padding:calc(env(safe-area-inset-top) + 24px) 20px}main{max-width:860px;margin:auto}button,input{font:inherit;padding:12px;border-radius:8px;border:1px solid #896878;background:#302139;color:inherit}button{cursor:pointer}input{width:100%;margin:6px 0}form{max-width:390px}section{padding:20px;border:1px solid #64465c;border-radius:12px;margin:18px 0}h1{font-size:26px}h2{font-size:18px}small,.muted{color:#c4aabb}.bar{display:flex;gap:10px;flex-wrap:wrap}a{color:#e9bd95}[hidden]{display:none!important}#status{white-space:pre-line}.source{margin:8px 0;padding:10px;background:#322238;border-radius:6px}</style></head><body><main><h1>TARO 관리자</h1><p class="muted">사주그랩 관리자 계정으로만 열 수 있습니다.</p><form id="login"><label>이메일<input id="email" type="email" autocomplete="username" required></label><label>비밀번호<input id="password" type="password" autocomplete="current-password" required></label><button>로그인</button></form><p id="status" role="status"></p><div id="panel" hidden><div class="bar"><button id="copy">사용자용 주소 복사</button><a href="https://tarot-with-you.vercel.app/" target="_blank" rel="noopener">사용자 화면 열기 ↗</a><button id="refresh">새로고침</button><button id="logout">로그아웃</button></div><section><h2>지식 연결 현황</h2><p id="summary"></p></section><h2>최근 상담에서 검색한 참고 자료</h2><p class="muted">최신 30회 · 사용자 질문과 대화 원문은 저장하지 않습니다. 아래 자료는 검색 결과이며, 답변에 모두 사용됐다는 뜻은 아닙니다.</p><div id="readings"></div></div></main><script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script><script src="/firebase-config.js"></script><script>
const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));if(!firebase.apps.length)firebase.initializeApp(window.firebaseConfig);const auth=firebase.auth();
async function refresh(){if(!auth.currentUser)return;try{const token=await auth.currentUser.getIdToken();const r=await fetch('/api/tarot?admin=1',{headers:{Authorization:'Bearer '+token},cache:'no-store'});const d=await r.json();if(!r.ok)throw Error(d.error);$('login').hidden=true;$('panel').hidden=false;$('status').textContent='관리자 인증 완료';$('summary').textContent=`타로 ${d.rag.tarot}개 · 공통 상담 ${d.rag.common}개 · 미승인/비활성 타로 ${d.rag.pendingTarot}개 제외`;$('readings').innerHTML=d.readings.length?d.readings.map(x=>`<section><small>${esc(new Date(x.createdAt).toLocaleString('ko-KR'))} · ${esc({clarify:'질문 대화',reading:'종합 풀이',followup:'후속 대화'}[x.action]||x.action)}</small><p>${x.cards.map(c=>esc(c.position+' · '+c.name+' · '+(c.reversed?'역방향':'정방향'))).join('<br>')}</p>${x.sources.length?x.sources.map(s=>`<div class="source">${esc(s.title)}<br><small>${esc(s.kind==='tarot'?'타로':'공통 상담')}</small></div>`).join(''):'<p class="muted">관련 참고 자료 없음</p>'}</section>`).join(''):'<p>아직 저장된 참고 자료가 없습니다. 새 상담부터 표시됩니다.</p>'}catch(e){$('panel').hidden=true;$('login').hidden=false;$('status').textContent=e.message}}
$('login').onsubmit=async e=>{e.preventDefault();$('status').textContent='로그인 중…';try{await auth.signInWithEmailAndPassword($('email').value.trim(),$('password').value);$('password').value=''}catch{$('status').textContent='로그인 정보를 확인해 주세요.'}};auth.onAuthStateChanged(u=>{if(u)refresh();else{$('panel').hidden=true;$('login').hidden=false;$('status').textContent=''}});$('logout').onclick=()=>auth.signOut();$('refresh').onclick=refresh;$('copy').onclick=async()=>{try{await navigator.clipboard.writeText('https://tarot-with-you.vercel.app/');$('status').textContent='사용자용 주소를 복사했습니다.'}catch{$('status').textContent='복사할 주소: https://tarot-with-you.vercel.app/'}};
</script></body></html>
